# adamos kitty config — Omarchy-inspired dark terminal

# Theme: black background, high contrast text
background #0b0c10
foreground #c5c8c6
selection_background #404460
selection_foreground #ffffff
url_color #528bff

# Black tones
color0  #1d1f21
color8  #282a2e

# Red
color1  #cc6666
color9  #cc6666

# Green
color2  #b5bd68
color10 #b5bd68

# Yellow
color3  #f0c674
color11 #f0c674

# Blue
color4  #81a2be
color12 #81a2be

# Magenta
color5  #b294bb
color13 #b294bb

# Cyan
color6  #8abeb7
color14 #8abeb7

# White
color7  #c5c8c6
color15 #e0e0e0

# Font
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
font_size        12.0

# Layout
window_padding_width 8
hide_window_decorations yes

# Cursor
cursor            #c5c8c6
cursor_shape      beam
cursor_beam_thickness 2.0

# Scrollback
scrollback_lines 10000

# Bell
visual_bell_duration 0.5
enable_audio_bell no

# Performance
sync_to_monitor no
